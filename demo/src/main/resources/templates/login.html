<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — CineVault</title>
<link rel="stylesheet"  th:href="@{/css/styles.css}">
</head>
<body>

  <div class="auth-page">
    <a href="/" class="logo">
      <span class="logo-icon">▶</span>
      Cine<span class="brand-vault">Vault</span>
    </a>

    <div class="auth-heading">
      <h1>Bienvenido de nuevo</h1>
      <p>Inicia sesión para seguir viendo</p>
    </div>

    <form class="auth-card" action="#" method="post">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
      </div>

      <div class="field-options">
        <label>
          <input type="checkbox" name="remember">
          Recordarme
        </label>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <a href="/app" class="btn btn-primary auth-submit">Iniciar sesión</a>

      <div class="auth-switch">
        ¿No tienes cuenta? <a href="/registrar">Crear cuenta gratis</a>
      </div>
    </form>

    <a href="/" class="auth-back">← Volver al inicio</a>
  </div>

</body>
</html>
