<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crea tu cuenta — CineVault</title>
<link rel="stylesheet"  th:href="@{/css/styles.css}">
</head>
<body>

  <div class="auth-page">
    <a href="/app" class="logo">
      <span class="logo-icon">▶</span>
      Cine<span class="brand-vault">Vault</span>
    </a>

    <div class="auth-heading">
      <h1>Crea tu cuenta</h1>
      <p>Acceso gratuito a miles de películas</p>
    </div>

    <form class="auth-card" action="#" method="post">
      <div class="field">
        <label for="name">Nombre completo</label>
        <input type="text" id="name" name="name" placeholder="Tu nombre" required>
      </div>

      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
      </div>

      <div class="field">
        <label for="confirm-password">Confirmar contraseña</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Repite tu contraseña" minlength="6" required>
      </div>

      <button type="submit" class="btn btn-primary auth-submit">Crear cuenta</button>

      <div class="auth-switch">
        ¿Ya tienes cuenta? <a href="/login">Iniciar sesión</a>
      </div>
    </form>

    <a href="/" class="auth-back">← Volver al inicio</a>
  </div>

</body>
</html>
